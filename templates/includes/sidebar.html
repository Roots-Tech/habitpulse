{% load static %}
<aside class="app-sidebar" id="appSidebar" aria-label="Main Vertical Sidebar">
  <!-- Top Brand Section -->
  <div class="sidebar-header">
    <a href="{% url 'dashboard' %}" class="sidebar-brand">
      <img src="{% static 'images/habit_icon.png' %}" alt="HabitPulse Logo" class="sidebar-logo">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-title">HabitPulse</span>
        <span class="sidebar-brand-sub">Daily Tracker</span>
      </div>
    </a>
    <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">✕</button>
  </div>

  <!-- Navigation Scroll Area -->
  <div class="sidebar-body">
    <!-- Main Navigation Group -->
    <div class="sidebar-nav-group">
      <div class="sidebar-heading">Navigation</div>
      <ul class="sidebar-menu">
        {% if user.can_view_dashboard %}
        <li class="sidebar-menu-item">
          <a href="{% url 'dashboard' %}" class="sidebar-menu-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <span class="sidebar-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </span>
            <span class="sidebar-menu-label">Dashboard</span>
          </a>
        </li>
        {% endif %}

        {% if user.can_manage_habits %}
        <li class="sidebar-menu-item">
          <a href="{% url 'habit_list' %}" class="sidebar-menu-link {% if 'habit' in request.resolver_match.url_name and request.resolver_match.url_name != 'habit_create' %}active{% endif %}">
            <span class="sidebar-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            </span>
            <span class="sidebar-menu-label">Habits</span>
          </a>
        </li>
        {% endif %}

        <!-- General Settings: Visible to ALL authenticated users -->
        <li class="sidebar-menu-item">
          <a href="{% url 'general_settings' %}" class="sidebar-menu-link {% if request.resolver_match.url_name == 'general_settings' %}active{% endif %}">
            <span class="sidebar-menu-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </span>
            <span class="sidebar-menu-label">General Settings</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</aside>
